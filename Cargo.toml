[workspace]
resolver = "2"
members = ["crates/lbn-core"]

[workspace.package]
version = "0.9.0-rc.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/jonnyace/lastbook-next"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
postcard = { version = "1", default-features = false, features = ["alloc"] }
minisign-verify = "0.3"
rust-stemmers = "1"
lbn-core = { path = "crates/lbn-core" }
lbn-native = { path = "crates/lbn-native" }

[profile.release]
codegen-units = 1
lto = true
strip = true
