[package]
name = "lastbook-next-desktop"
description = "Lastbook Next desktop app (Tauri 2): the shared web UI over the native engine."
version = "0.9.0-rc.1"
edition = "2021"
license = "MIT"
rust-version = "1.95"

# Separate workspace: the desktop needs platform SDKs (WebKitGTK on Linux) that the CLI and libraries do not.
[workspace]

[[bin]]
name = "lastbook-next"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
lbn-core = { path = "../../../crates/lbn-core" }
lbn-native = { path = "../../../crates/lbn-native" }
tauri = { version = "=2.12.6", features = [] }
serde_json = "1"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
