[package]
name = "lbn-cli"
description = "ark-pack: command-line tool to build, sign, inspect, verify, install and search Ark packs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ark-pack"
path = "src/main.rs"

[dependencies]
lbn-core.workspace = true
lbn-native.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "6"
minisign = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
