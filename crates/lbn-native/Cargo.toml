[package]
name = "lbn-native"
description = "Lastbook Next native platform adapter: pack store with staged/atomic installs, downloads, zip import, SQLite registry and personal data, llama.cpp runner control, and the native engine dispatcher."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lbn-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
fs4 = "1"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
